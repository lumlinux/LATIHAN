{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div>
    <span class="eyebrow">Administration</span>
    <h2>{{ title }}</h2>
    <p>Atur profil akun, kredensial, role, dan organization pengguna.</p>
  </div>
  <a class="ghost-button" href="{{ url_for('users_page') }}">Kembali</a>
</section>

<form method="post" class="panel-card form-grid">
  <label class="form-field">
    <span>Full Name</span>
    <input type="text" name="full_name" value="{{ user_row.full_name if user_row else '' }}" required />
  </label>
  <label class="form-field">
    <span>Username</span>
    <input type="text" name="username" value="{{ user_row.username if user_row else '' }}" {% if user_row %}readonly{% else %}required{% endif %} />
  </label>
  <label class="form-field">
    <span>Email</span>
    <input type="email" name="email" value="{{ user_row.email if user_row else '' }}" required />
  </label>
  <label class="form-field">
    <span>Phone</span>
    <input type="text" name="phone" value="{{ user_row.phone if user_row else '' }}" />
  </label>
  <label class="form-field">
    <span>Unit / Department</span>
    <input type="text" name="department" value="{{ user_row.department if user_row else '' }}" />
  </label>
  <label class="form-field">
    <span>Position</span>
    <input type="text" name="position" value="{{ user_row.position if user_row else '' }}" />
  </label>
  <label class="form-field">
    <span>Password {% if user_row %}(kosongkan jika tidak diubah){% endif %}</span>
    <input type="password" name="password" {% if not user_row %}required{% endif %} />
  </label>
  <label class="form-field">
    <span>Confirm Password {% if user_row %}(isi hanya jika mengubah password){% endif %}</span>
    <input type="password" name="confirm_password" {% if not user_row %}required{% endif %} />
  </label>
  <label class="form-field">
    <span>Role</span>
    <select name="role_id" required>
      <option value="">Pilih Role</option>
      {% for role in roles %}
      <option value="{{ role.id }}" {% if user_row and user_row.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="form-field">
    <span>Organization</span>
    <select name="organization_id" required>
      <option value="">Pilih Organization</option>
      {% for organization in organizations %}
      <option value="{{ organization.id }}" {% if user_row and user_row.organization_id == organization.id %}selected{% endif %}>{{ organization.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="toggle-field">
    <input type="checkbox" name="is_active" {% if not user_row or user_row.is_active %}checked{% endif %} />
    <span>User aktif</span>
  </label>
  {% if user_row %}
  <div class="detail-item">
    <span>Last Login</span>
    <strong>{{ user_row.last_login_at|datetime_label }}</strong>
  </div>
  {% endif %}
  <div class="form-actions">
    <button type="submit" class="primary-button">Simpan</button>
    <a class="ghost-button" href="{{ url_for('users_page') }}">Batal</a>
  </div>
</form>
{% endblock %}
